<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260"
     role="img" aria-labelledby="title desc">
  <title id="title">Hook/busy lamp field</title>
  <desc id="desc">Eight paired columns of hook and busy LEDs, slots 0–7.
  Busy LEDs sit on the underside of the busy boards so each block is a tight pair.
  Port 23 is lit as a call.</desc>

  <defs>
    <style type="text/css"><![CDATA[
      .frame { fill: #1a1a1a; stroke: #e8e8e8; stroke-width: 1.5; }
      .legend { fill: #2a2a2a; stroke: #555; stroke-width: 1; }
      .label { fill: #999; font: 11px ui-sans-serif, system-ui, sans-serif; }
      .hook-off { fill: #2a2a2a; stroke: #3d9e6a; stroke-width: 1.2; }
      .hook-on  { fill: #3d9e6a; stroke: #3d9e6a; stroke-width: 1.2; }
      .busy-off { fill: #2a2a2a; stroke: #d4783a; stroke-width: 1.2; }
      .busy-on  { fill: #d4783a; stroke: #d4783a; stroke-width: 1.2; }
      .leader { fill: none; stroke: #555; stroke-width: 1; }
      .note { fill: #777; font: 10px ui-sans-serif, system-ui, sans-serif; }
    ]]></style>
  </defs>

  <rect class="frame" x="8" y="8" width="704" height="244" rx="3"/>

